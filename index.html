<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Star Games</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: #080b12;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
}

.app {
    max-width: 520px;
    margin: auto;
    padding-bottom: 90px;
}

/* HEADER */

.header {
    padding: 18px 18px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 23px;
    font-weight: 800;
}

.logo span {
    color: #ffd43b;
}

.profile {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffd43b, #ff9f1c);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
}

/* BALANCE */

.balance {
    margin: 10px 16px;
    padding: 20px;
    border-radius: 22px;
    background: linear-gradient(135deg, #171d2b, #101522);
    border: 1px solid #252d3d;
}

.balance-title {
    color: #8993a8;
    font-size: 13px;
}

.balance-number {
    font-size: 34px;
    font-weight: 800;
    margin-top: 5px;
}

.balance-number span {
    font-size: 25px;
}

/* SECTION */

.section {
    padding: 20px 16px 8px;
}

.section-title {
    font-size: 20px;
    font-weight: 800;
}

/* GAMES */

.games {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 10px 16px;
}

.game {
    min-height: 145px;
    border-radius: 20px;
    padding: 17px;
    position: relative;
    overflow: hidden;
    border: 1px solid #252d3d;
}

.game:nth-child(1) {
    background: linear-gradient(145deg, #17233a, #101722);
}

.game:nth-child(2) {
    background: linear-gradient(145deg, #302018, #17100d);
}

.game:nth-child(3) {
    background: linear-gradient(145deg, #251c36, #151020);
}

.game:nth-child(4) {
    background: linear-gradient(145deg, #173329, #101c19);
}

.game-icon {
    font-size: 36px;
    margin-bottom: 12px;
}

.game-title {
    font-size: 17px;
    font-weight: 800;
}

.game-sub {
    color: #8d98ac;
    font-size: 12px;
    margin-top: 5px;
}

/* BUTTON */

.play {
    margin: 8px 16px;
    width: calc(100% - 32px);
    border: 0;
    border-radius: 17px;
    padding: 16px;
    background: #ffd43b;
    color: #111;
    font-size: 17px;
    font-weight: 800;
}

/* BONUS */

.bonus {
    margin: 18px 16px;
    padding: 18px;
    border-radius: 20px;
    background: linear-gradient(135deg, #171d2b, #111621);
    border: 1px solid #252d3d;
}

.bonus-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.bonus-title {
    font-size: 16px;
    font-weight: 800;
}

.bonus-text {
    color: #8993a8;
    font-size: 13px;
    margin-top: 5px;
}

.bonus-button {
    border: 0;
    background: #ffd43b;
    color: #111;
    border-radius: 12px;
    padding: 10px 14px;
    font-weight: 800;
}

/* BOTTOM NAV */

.nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(520px, 100%);
    height: 72px;
    background: rgba(13,17,26,.96);
    border-top: 1px solid #252d3d;
    display: flex;
    justify-content: space-around;
    align-items: center;
    backdrop-filter: blur(15px);
}

.nav-item {
    color: #687389;
    text-align: center;
    font-size: 11px;
}

.nav-item.active {
    color: #ffd43b;
}

.nav-icon {
    font-size: 22px;
    margin-bottom: 3px;
}

/* GAME MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: #080b12;
    z-index: 10;
}

.modal-content {
    padding: 20px;
    max-width: 520px;
    margin: auto;
}

.close {
    color: #8993a8;
    font-size: 30px;
    margin-bottom: 30px;
}

.crash-box {
    height: 280px;
    border-radius: 24px;
    background: radial-gradient(circle at center, #17243b, #0d121c);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    border: 1px solid #252d3d;
}

.multiplier {
    font-size: 55px;
    font-weight: 900;
}

.crash-status {
    color: #8993a8;
    margin-top: 8px;
}

.big-button {
    width: 100%;
    margin-top: 18px;
    padding: 17px;
    border: 0;
    border-radius: 17px;
    background: #ffd43b;
    font-size: 18px;
    font-weight: 900;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">⭐ <span>STAR</span> GAMES</div>
        <div class="profile">👤</div>
    </div>

    <div class="balance">
        <div class="balance-title">Виртуальный баланс</div>
        <div class="balance-number" id="balance">
            10 000 <span>🪙</span>
        </div>
    </div>

    <div class="section">
        <div class="section-title">🎮 Игры</div>
    </div>

    <div class="games">

        <div class="game">
            <div class="game-icon">🚀</div>
            <div class="game-title">Crash</div>
            <div class="game-sub">Множитель растёт</div>
        </div>

        <div class="game">
            <div class="game-icon">💣</div>
            <div class="game-title">Mines</div>
            <div class="game-sub">Найди безопасные клетки</div>
        </div>

        <div class="game">
            <div class="game-icon">🎰</div>
            <div class="game-title">Slots</div>
            <div class="game-sub">Крути барабаны</div>
        </div>

        <div class="game">
            <div class="game-icon">🎡</div>
            <div class="game-title">Wheel</div>
            <div class="game-sub">Испытай удачу</div>
        </div>

    </div>

    <button class="play" onclick="openCrash()">
        🚀 Играть в Crash
    </button>

    <div class="bonus">

        <div class="bonus-top">

            <div>
                <div class="bonus-title">🎁 Ежедневный бонус</div>
                <div class="bonus-text">Получи 500 виртуальных монет</div>
            </div>

            <button class="bonus-button" onclick="getBonus()">
                Получить
            </button>

        </div>

    </div>

</div>


<div class="nav">

    <div class="nav-item active">
        <div class="nav-icon">🎮</div>
        Игры
    </div>

    <div class="nav-item">
        <div class="nav-icon">🏆</div>
        Рейтинг
    </div>

    <div class="nav-item">
        <div class="nav-icon">🎁</div>
        Бонус
    </div>

    <div class="nav-item">
        <div class="nav-icon">👤</div>
        Профиль
    </div>

</div>


<div class="modal" id="crashModal">

    <div class="modal-content">

        <div class="close" onclick="closeCrash()">←</div>

        <h1>🚀 Crash</h1>

        <br>

        <div class="crash-box">

            <div class="multiplier" id="multiplier">
                1.00x
            </div>

            <div class="crash-status" id="status">
                Готово к игре
            </div>

        </div>

        <button class="big-button" onclick="startCrash()">
            НАЧАТЬ
        </button>

    </div>

</div>


<script>

let balance = 10000;
let playing = false;

function updateBalance() {

    document.getElementById("balance").innerHTML =
        balance.toLocaleString("ru-RU") +
        ' <span>🪙</span>';

}


function getBonus() {

    balance += 500;

    updateBalance();

    alert("🎁 Ты получил 500 виртуальных монет!");

}


function openCrash() {

    document.getElementById("crashModal").style.display = "block";

}


function closeCrash() {

    document.getElementById("crashModal").style.display = "none";

}


function startCrash() {

    if (playing) return;

    playing = true;

    let multiplier = 1;

    document.getElementById("status").innerText =
        "Множитель растёт...";

    const interval = setInterval(() => {

        multiplier += 0.05;

        document.getElementById("multiplier").innerText =
            multiplier.toFixed(2) + "x";

        if (multiplier >= 2.50) {

            clearInterval(interval);

            playing = false;

            const reward = 250;

            balance += reward;

            updateBalance();

            document.getElementById("status").innerText =
                "🚀 Успех! +" + reward + " 🪙";

        }

    }, 100);

}

</script>

</body>
</html>
