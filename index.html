DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Random Games</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-main: #0a0d14;
      --card-bg: rgba(23, 29, 43, 0.7);
      --accent-yellow: #ffd43b;
      --accent-green: #2ecc71;
      --accent-red: #e74c3c;
      --text-muted: #6f7d93;
      --border-color: rgba(255, 255, 255, 0.08);
      --glass-nav: rgba(14, 18, 27, 0.9);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: #ffffff;
      padding-bottom: 85px;
      overflow-x: hidden;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    /* --- TOAST --- */
    .toast {
      position: fixed;
      top: 75px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(23, 29, 43, 0.95);
      border: 1px solid var(--border-color);
      padding: 12px 22px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      z-index: 500;
      backdrop-filter: blur(10px);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* --- HEADER --- */
    .header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--glass-nav);
      backdrop-filter: blur(15px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffd43b, #ff922b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #000;
      font-size: 18px;
      box-shadow: 0 0 12px rgba(255, 212, 59, 0.25);
    }

    .user-name {
      font-size: 14px;
      font-weight: 700;
    }

    .balance-box {
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 12px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .balance-amount {
      font-size: 15px;
      font-weight: 800;
      color: var(--accent-yellow);
    }

    .btn-deposit {
      background: linear-gradient(135deg, #ffd43b, #ffa900);
      border: none;
      border-radius: 8px;
      padding: 5px 10px;
      font-weight: 800;
      font-size: 12px;
      color: #000;
      cursor: pointer;
    }

    /* --- BANNER --- */
    .promo-banner {
      margin: 14px 16px;
      padding: 16px;
      background: linear-gradient(135deg, #ffd43b 0%, #ff8c00 100%);
      border-radius: 20px;
      color: #111;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 14px;
      box-shadow: 0 6px 20px rgba(255, 140, 0, 0.25);
      cursor: pointer;
    }

    /* --- GAMES GRID (RANDOM GAMES STYLE) --- */
    .section-title {
      padding: 0 16px;
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 16px;
    }

    .game-card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      aspect-ratio: 1 / 1.3;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 12px 6px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      transition: transform 0.15s ease;
      backdrop-filter: blur(5px);
    }

    .game-card:active {
      transform: scale(0.94);
    }

    .game-card img {
      position: absolute;
      top: 10px;
      width: 60px;
      height: 60px;
      object-fit: contain;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
    }

    .game-card .title {
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      z-index: 2;
      color: #fff;
    }

    .badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 2px 6px;
      font-size: 9px;
      font-weight: 800;
      color: var(--accent-yellow);
    }

    /* Gradient Themes */
    .bg-plane { background: linear-gradient(180deg, #3d1c24 0%, #111622 100%); }
    .bg-mines { background: linear-gradient(180deg, #1b3d30 0%, #111622 100%); }
    .bg-slots { background: linear-gradient(180deg, #1d2b45 0%, #111622 100%); }
    .bg-gift { background: linear-gradient(180deg, #3d311b 0%, #111622 100%); }
    .bg-pvp { background: linear-gradient(180deg, #2b1f3d 0%, #111622 100%); }

    /* --- BOTTOM NAV --- */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(480px, 100%);
      height: 70px;
      background: var(--glass-nav);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--accent-yellow);
    }

    .nav-item div { font-size: 20px; }

    /* --- PAGES / SCREENS --- */
    .screen {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg-main);
      z-index: 200;
      overflow-y: auto;
      max-width: 480px;
      margin: 0 auto;
    }
    .screen.active { display: block; }

    .screen-header {
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid var(--border-color);
      background: var(--glass-nav);
    }

    .btn-back {
      font-size: 28px;
      cursor: pointer;
      color: var(--text-muted);
    }

    .controls {
      background: var(--card-bg);
      margin: 16px;
      padding: 16px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .input-group { margin-bottom: 12px; }
    .input-group label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .input-group input {
      width: 100%;
      padding: 14px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
    }

    .btn-action {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #ffd43b, #ffa900);
      color: #000;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 212, 59, 0.25);
    }

    .btn-cashout {
      background: linear-gradient(135deg, #2ecc71, #27ae60) !important;
      color: #fff !important;
      box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3) !important;
    }

    /* --- ИГРА: САМОЛЁТИК (CRASH) --- */
    .plane-area {
      height: 240px;
      margin: 16px;
      border-radius: 20px;
      background: radial-gradient(circle at center, #23121e 0%, #0d1017 100%);
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .plane-mult {
      font-size: 48px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 212, 59, 0.4);
    }

    .plane-img {
      font-size: 45px;
      position: absolute;
      bottom: 20px;
      left: 20px;
      transition: all 0.1s linear;
    }

    .plane-crashed {
      color: var(--accent-red) !important;
    }

    /* --- ИГРА: МИНЫ --- */
    .mines-board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 16px;
    }

    .mine-cell {
      aspect-ratio: 1;
      background: #161c29;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .mine-cell:active { transform: scale(0.9); }

    .mine-cell.safe {
      background: rgba(46, 204, 113, 0.15);
      border-color: var(--accent-green);
    }

    .mine-cell.bomb {
      background: rgba(231, 76, 60, 0.2);
      border-color: var(--accent-red);
    }
  </style>
</head>
<body>

<div class="app">

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- HEADER -->
  <div class="header">
    <div class="user-info">
      <div class="user-avatar" id="avatar">👤</div>
      <div class="user-name" id="username">Player</div>
    </div>
    <div class="balance-box">
      <span class="balance-amount" id="balance">10 000 🪙</span>
      <button class="btn-deposit" onclick="showToast('⭐ Раздел пополнения скоро!')">+ ⭐</button>
    </div>
  </div>

  <!-- HOME PAGE -->
  <div id="homePage">
    <div class="promo-banner" onclick="showToast('🎁 Награда получена: +500 🪙!')">
      <span>🎁 Забрать ежедневную награду</span>
      <span style="font-size: 18px;">➔</span>
    </div>

    <div class="section-title">Все игры</div>

    <div class="games-grid">
      <!-- Самолетик -->
      <div class="game-card bg-plane" onclick="openGame('planeScreen')">
        <div class="badge">HOT</div>
        <img src="https://cdn-icons-png.flaticon.com/512/1356/1356479.png" alt="Plane">
        <div class="title">Самолётик</div>
      </div>

      <!-- Мины -->
      <div class="game-card bg-mines" onclick="openGame('minesScreen')">
        <img src="https://cdn-icons-png.flaticon.com/512/3502/3502685.png" alt="Mines">
        <div class="title">Мины</div>
      </div>

      <!-- PVP -->
      <div class="game-card bg-pvp" onclick="showToast('⚔️ Скоро!')">
        <img src="https://cdn-icons-png.flaticon.com/512/1063/1063376.png" alt="PVP">
        <div class="title">PVP</div>
      </div>

      <!-- Розыгрыши -->
      <div class="game-card bg-gift" onclick="showToast('🧢 Скоро!')">
        <div class="badge">3 активных</div>
        <img src="https://cdn-icons-png.flaticon.com/512/3349/3349232.png" alt="Giveaway">
        <div class="title">Розыгрыши</div>
      </div>

      <!-- Слоты -->
      <div class="game-card bg-slots" onclick="showToast('🎰 Скоро!')">
        <img src="https://cdn-icons-png.flaticon.com/512/2618/2618170.png" alt="Slots">
        <div class="title">MineSlot</div>
      </div>

      <!-- Дорога -->
      <div class="game-card bg-mines" onclick="showToast('🎁 Скоро!')">
        <div class="badge">x2.5</div>
        <img src="https://cdn-icons-png.flaticon.com/512/4213/4213958.png" alt="Road">
        <div class="title">Дорога</div>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <div>🏠</div>
      <span>Главная</span>
    </div>
    <div class="nav-item" onclick="showToast('🏪 Магазин скоро!')">
      <div>⭐</div>
      <span>Магазин</span>
    </div>
    <div class="nav-item" onclick="showToast('🏆 Лидеры скоро!')">
      <div>🏆</div>
      <span>Лидеры</span>
    </div>
    <div class="nav-item" onclick="showToast('👤 Профиль скоро!')">
      <div>👤</div>
      <span>Профиль</span>
    </div>
  </div>

  <!-- ИГРА: САМОЛЁТИК (CRASH) -->
  <div id="planeScreen" class="screen">
    <div class="screen-header">
      <div class="btn-back" onclick="closeGame('planeScreen')">‹</div>
      <h3>🚀 Самолётик (Crash)</h3>
    </div>

    <div class="plane-area">
      <div class="plane-mult" id="planeMult">1.00x</div>
      <div class="plane-img" id="planeImg">🚀</div>
    </div>

    <div class="controls">
      <div class="input-group">
        <label>Ставка (🪙):</label>
        <input type="number" id="planeBet" value="100" min="10">
      </div>
      <button class="btn-action" id="btnStartPlane" onclick="startPlane()">ВЗЛЕТЕТЬ</button>
      <button class="btn-action btn-cashout" id="btnCashoutPlane" style="display:none;" onclick="cashoutPlane()">ЗАБРАТЬ <span id="planeWin">0</span> 🪙</button>
    </div>
  </div>

  <!-- ИГРА: МИНЫ -->
  <div id="minesScreen" class="screen">
    <div class="screen-header">
      <div class="btn-back" onclick="closeGame('minesScreen')">‹</div>
      <h3>⛏️ Игра Мины</h3>
    </div>

    <div class="controls">
      <div class="input-group">
        <label>Ставка (🪙):</label>
        <input type="number" id="betAmount" value="100" min="10">
      </div>
      <div class="input-group">
        <label>Количество мин (1-24):</label>
        <input type="number" id="minesCount" value="3" min="1" max="24">
      </div>
      <button class="btn-action" id="btnStartMines" onclick="startMinesGame()">НАЧАТЬ ИГРУ</button>
      <button class="btn-action btn-cashout" id="btnCashoutMines" style="display:none;" onclick="cashoutMines()">ЗАБРАТЬ <span id="winAmount">0</span> 🪙</button>
    </div>

    <div class="mines-board" id="minesBoard"></div>
  </div>

</div>

<script>
  // TELEGRAM SDK
  const tg = window.Telegram.WebApp;
  tg.expand();

  if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
    const user = tg.initDataUnsafe.user;
    document.getElementById('username').innerText = user.first_name;
    document.getElementById('avatar').innerText = user.first_name[0];
  }

  function haptic(type = 'light') {
    if (tg.HapticFeedback) {
      if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
      else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      else tg.HapticFeedback.impactOccurred('light');
    }
  }

  function showToast(text) {
    const t = document.getElementById('toast');
    t.innerText = text;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  // БАЛАНС
  let balance = Number(localStorage.getItem('user_balance')) || 10000;
  function updateBalanceDisplay() {
    document.getElementById('balance').innerText = balance.toLocaleString('ru-RU') + ' 🪙';
    localStorage.setItem('user_balance', balance);
  }

  function openGame(id) {
    haptic('light');
    document.getElementById(id).classList.add('active');
    if (id === 'minesScreen') initBlankBoard();
  }

  function closeGame(id) {
    haptic('light');
    document.getElementById(id).classList.remove('active');
  }

  // --- ИГРА: САМОЛЁТИК (CRASH) ---
  let planeTimer = null;
  let planeMult = 1.0;
  let planeCrashPoint = 0;
  let planeBetVal = 0;
  let planeActive = false;

  function startPlane() {
    const bet = Number(document.getElementById('planeBet').value);
    if (bet > balance || bet <= 0) {
      haptic('error');
      showToast('❌ Недостаточно очков!');
      return;
    }

    haptic('success');
    balance -= bet;
    planeBetVal = bet;
    updateBalanceDisplay();

    planeMult = 1.0;
    // Определение точки краша
    planeCrashPoint = (Math.random() * 3 + 1.1).toFixed(2);
    planeActive = true;

    document.getElementById('btnStartPlane').style.display = 'none';
    document.getElementById('btnCashoutPlane').style.display = 'block';
    
    const multText = document.getElementById('planeMult');
    const img = document.getElementById('planeImg');
    multText.classList.remove('plane-crashed');
    img.style.left = '20px';
    img.style.bottom = '20px';

    planeTimer = setInterval(() => {
      planeMult += 0.03;
      multText.innerText = planeMult.toFixed(2) + 'x';
      document.getElementById('planeWin').innerText = Math.floor(planeBetVal * planeMult);

      // Анимация полета
      img.style.left = Math.min(200, 20 + planeMult * 40) + 'px';
      img.style.bottom = Math.min(140, 20 + planeMult * 25) + 'px';

      if (planeMult >= planeCrashPoint) {
        clearInterval(planeTimer);
        planeActive = false;
        haptic('error');
        multText.innerText = '💥 ' + planeCrashPoint + 'x';
        multText.classList.add('plane-crashed');
        showToast('💥 Самолётик улетел!');
        resetPlaneControls();
      }
    }, 100);
  }

  function cashoutPlane() {
    if (!planeActive) return;
    clearInterval(planeTimer);
    planeActive = false;

    const win = Math.floor(planeBetVal * planeMult);
    balance += win;
    updateBalanceDisplay();
    haptic('success');
    showToast(`🎉 Вы забрали +${win} 🪙!`);
    resetPlaneControls();
  }

  function resetPlaneControls() {
    document.getElementById('btnStartPlane').style.display = 'block';
    document.getElementById('btnCashoutPlane').style.display = 'none';
  }

  // --- ИГРА: МИНЫ ---
  let minesArray = [];
  let currentBet = 0;
  let currentMinesCount = 3;
  let openedSafeCells = 0;
  let gameInProgress = false;

  function initBlankBoard() {
    const board = document.getElementById('minesBoard');
    board.innerHTML = '';
    for (let i = 0; i < 25; i++) {
      const cell = document.createElement('div');
      cell.className = 'mine-cell';
      cell.innerText = '❓';
      board.appendChild(cell);
    }
  }

  function startMinesGame() {
    const betInput = Number(document.getElementById('betAmount').value);
    const minesInput = Number(document.getElementById('minesCount').value);

    if (betInput > balance || betInput <= 0) {
      haptic('error');
      showToast('❌ Недостаточно очков!');
      return;
    }

    haptic('success');
    balance -= betInput;
    currentBet = betInput;
    currentMinesCount = minesInput;
    openedSafeCells = 0;
    gameInProgress = true;
    updateBalanceDisplay();

    minesArray = Array(25).fill(false);
    let placed = 0;
    while (placed < currentMinesCount) {
      let idx = Math.floor(Math.random() * 25);
      if (!minesArray[idx]) {
        minesArray[idx] = true;
        placed++;
      }
    }

    const board = document.getElementById('minesBoard');
    board.innerHTML = '';
    for (let i = 0; i < 25; i++) {
      const cell = document.createElement('div');
      cell.className = 'mine-cell';
      cell.innerText = '';
      cell.onclick = () => clickCell(cell, i);
      board.appendChild(cell);
    }

    document.getElementById('btnStartMines').style.display = 'none';
    document.getElementById('btnCashoutMines').style.display = 'block';
    updateWinAmount();
  }

  function calculateMultiplier() {
    let mult = 1.0;
    for (let i = 0; i < openedSafeCells; i++) {
      mult *= (25 - i) / (25 - currentMinesCount - i);
    }
    return mult.toFixed(2);
  }

  function updateWinAmount() {
    const win = Math.floor(currentBet * calculateMultiplier());
    document.getElementById('winAmount').innerText = win.toLocaleString('ru-RU');
  }

  function clickCell(cell, index) {
    if (!gameInProgress || cell.classList.contains('safe') || cell.classList.contains('bomb')) return;

    if (minesArray[index]) {
      haptic('error');
      cell.classList.add('bomb');
      cell.innerText = '💣';
      gameInProgress = false;
      showToast('💥 Увы, взрыв!');
      resetGameControls();
    } else {
      haptic('light');
      cell.classList.add('safe');
      cell.innerText = '💎';
      openedSafeCells++;
      updateWinAmount();

      if (openedSafeCells === 25 - currentMinesCount) cashoutMines();
    }
  }

  function cashoutMines() {
    if (!gameInProgress || openedSafeCells === 0) return;

    haptic('success');
    const win = Math.floor(currentBet * calculateMultiplier());
    balance += win;
    gameInProgress = false;

    updateBalanceDisplay();
    showToast(`🎉 Выиграно +${win} 🪙!`);
    resetGameControls();
  }

  function resetGameControls() {
    document.getElementById('btnStartMines').style.display = 'block';
    document.getElementById('btnCashoutMines').style.display = 'none';
  }

  updateBalanceDisplay();
</script>

</body>
</html>
